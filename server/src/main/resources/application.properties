spring.application.name=temelo-server

# Local development database: the PostgreSQL in compose.yaml, on the host port
# it publishes (TEMELO_DB_PORT, 5433 by default). Every value can be overridden
# from the environment (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD); these credentials exist only for that local
# container. Tests ignore them: Testcontainers starts its own PostgreSQL and
# connects through @ServiceConnection.
spring.datasource.url=jdbc:postgresql://localhost:${TEMELO_DB_PORT:5433}/temelo
spring.datasource.username=temelo
spring.datasource.password=temelo

# Flyway owns the schema; its migrations go in src/main/resources/db/migration.
# Hibernate only checks that the entities match it and never changes a table.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from a controller: a request's database work ends with its
# service call.
spring.jpa.open-in-view=false

# Give up on a database connection after 5 s (in ms) rather than Hikari's 30 s,
# so a request (and GET /api/health) answers promptly when PostgreSQL is gone.
spring.datasource.hikari.connection-timeout=5000

# Errors from Spring MVC itself (404, 405, 415, ...) as RFC 9457 problem
# details, the same shape the share API uses for its own refusals.
spring.mvc.problemdetails.enabled=true

# Shared timetables: how long a link works, the largest upload accepted, and
# how often expired ones are deleted (a read ignores them either way).
temelo.share.ttl=14d
temelo.share.max-size=1MB
temelo.share.purge-interval=PT1H

# OpenAPI description at /v3/api-docs, Swagger UI at /swagger-ui.html. Both
# are public on purpose: the API has no secrets, and the page documents it.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
